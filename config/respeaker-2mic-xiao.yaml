# =============================================================================
# ReSpeaker 2-Mic Pi HAT v1 (Keyestudio KS0314 / Seeed v1, WM8960 codec)
# on a Seeed XIAO ESP32S3 as a stand-alone Home Assistant voice satellite.
#
# FIRMWARE VERSION 2.0 (esphome: project: version below - bump both together;
# Home Assistant shows it on the Voice Box device page)
#   2.0  2026-10-23  mic deaf while the box talks (+0.5 s): no more hearing its own
#                    questions as answers; wake words ignored while talking or
#                    listening (no more cut-off sentences); no stop word
#   1.9  2026-10-23  ring dark when idle (white chip off), HAT LEDs off when idle
#   1.8  2026-10-23  Dazzle ring effect; RGBW ring (SK6812, GRBW) by default
#   1.7  2026-10-21  speaker_volume +6 dB
#   1.6  2026-10-21  mclk_frequency: 24MHz (KS0314 oscillator, through the PLL)
#   1.5  2026-10-21  Mic sample rate / Mic peak diagnostic sensors
#   1.4  2026-10-21  wiring notes: 3.3 V on pin 17 too (not joined to pin 1)
#   1.3  2026-10-21  greeter: finger pad + MAX30102, scan effects, HA events,
#                    transcript events, Greeter mode switch
#   1.2  2026-10-21  Gimp wake words removed (front door box)
#   1.1  2026-10-20  NeoPixel ring, voice box secrets
#   1.0  2026-10-19  first version
#
# Paste into a new device in ESPHome Builder. Wi-Fi, API and OTA secrets come
# from ESPHome Builder's own secrets.yaml.
#
# Wiring (Pi header pin on the HAT -> XIAO ESP32S3):
#   12 I2S bit clock  -> D9  (GPIO8)    the HAT drives it
#   35 I2S word clock -> D8  (GPIO7)    the HAT drives it
#   38 mic data       -> D6  (GPIO43)   HAT -> XIAO
#   40 speaker data   -> D7  (GPIO44)   XIAO -> HAT
#    3 I2C SDA        -> D4  (GPIO5)    + 4.7k pull-up to 3.3 V (the HAT has none;
#    5 I2C SCL        -> D5  (GPIO6)    + 4.7k pull-up to 3.3 V  a Pi supplies them)
#   11 button         -> D0  (GPIO1)
#   19 LED data       -> D1  (GPIO2)    3x APA102
#   23 LED clock      -> D3  (GPIO4)
#    1 3.3 V          -> 3V3
#   17 3.3 V          -> 3V3 as well: pins 1 and 17 are NOT joined on the KS0314
#                        (a Pi joins them), and with 17 dead I2C reads "SCL held low"
#    4 5 V            -> 5V as well, unless pins 2 and 4 read 0 ohms to each other
#    2 5 V            -> 5V             power the HAT's micro-USB with a good
#    6 GND            -> GND            5 V supply; unplug it while flashing
#   Speaker (HAT speaker connector): the two outputs are bridge-tied - never let
#   them touch each other or ground, and connect the speaker with the power off.
#   A short there can take out the WM8960 entirely.
#   Doorbell button (optional, to GND) -> D10 (GPIO9)
#
# Adafruit NeoPixel Ring 12 (WS2812):
#   DIN -> D2 (GPIO3) through a 330-470 ohm resistor
#   5V  -> 5 V (same 5 V supply as the HAT, not the XIAO's 3V3)
#   GND -> GND
#   Put a 470-1000 uF capacitor across the ring's 5V and GND.
#   On the front door greeter this is the ring round the camera lens.
#
# Finger "scanner" (XIAO ESP32S3 Plus only - D11 is one of its extra edge pads):
#   CJMCU-0101 touch pad: OUT -> D11 (GPIO38), VCC -> 3V3, GND -> GND
#   MAX30102 pulse-ox board: SDA -> D4, SCL -> D5 (same bus as the HAT),
#     VIN -> 3V3, GND -> GND, INT/RD/IRD unused. The purple board's 3-pad
#     solder jumper sets its I2C pull-ups to 1.8 V or 3.3 V: bridge it to 3.3 V
#     (at 1.8 V, SDA idles near 2.5 V on this bus and I2C gets flaky).
#   Touching the pad lights the MAX30102's red LED through the finger, runs a
#   scan on the ring and HAT LEDs, then tells Home Assistant (event
#   esphome.greeter_visitor, source: finger). The HAT button and the doorbell
#   send the same event (source: button / doorbell). ha/front_door_greeter.yaml
#   runs the rest: "fingerprint scan complete", the face scan, the conversation
#   and the text summary. Everything said is sent as esphome.greeter_transcript.
#   In HA, turn on "Allow the device to perform Home Assistant actions" for
#   this device, or the events never arrive.
#
# Use the u.FL antenna: route it to the outside of the case.
# =============================================================================

substitutions:
  name: voice-box
  friendly_name: Voice Box
  flash_size: 8MB          # 16MB on a XIAO ESP32S3 Plus
  respeaker_repo: https://github.com/redeyejoe/Respeaker-XVF3800-ESPHome-integration
  respeaker_ref: main
  respeaker_repo_raw: https://raw.githubusercontent.com/redeyejoe/Respeaker-XVF3800-ESPHome-integration

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  project:
    name: redeyejoe.ReSpeaker 2-Mic XIAO ESP32S3
    version: "2.0"
  on_boot:
    priority: 375
    then:
      - script.execute:
          id: set_leds
          phase: offline
      - script.execute:
          id: pulse_ox_light
          light_on: false

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: ${flash_size}
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source:
      type: git
      url: ${respeaker_repo}
      ref: ${respeaker_ref}
    components: [wm8960]
    refresh: 1d

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG   # GPIO43/44 carry audio

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

api:
  encryption:
    key: !secret voice_box_api_key

ota:
  # If flash or RAM ever gets tight: dropping this password saves about 3.5 KB of
  # flash. Swap it for `encryption: key: <the api encryption key>` (uploads then
  # use the API key). Do that switch over USB, not OTA, in case it locks out.
  - platform: esphome
    id: ota_esphome
    password: !secret voice_box_ota_password

# ---------------------------------------------------------------------------
# Audio hardware
# ---------------------------------------------------------------------------

i2c:
  - id: hat_i2c
    sda: GPIO5
    scl: GPIO6
    frequency: 100kHz

# MAX30102 pulse oximeter on the same bus. No ESPHome driver needed: the scan
# only switches its red LED on and reads one sample (see pulse_ox_light below).
i2c_device:
  - id: pulse_ox
    i2c_id: hat_i2c
    address: 0x57

audio_dac:
  - platform: wm8960
    id: wm8960_dac
    i2c_id: hat_i2c
    mclk_frequency: 24MHz   # Keyestudio KS0314: 24 MHz oscillator. Seeed boards: 12.288MHz.
                            # Wrong value = "Mic sample rate" far from 16000, no wake words.
    # mic_boost: 29       # dB: 0, 13, 20 or 29
    # mic_gain: 12        # dB: -17.25 .. 30
    speaker_volume: 6     # dB, -73 .. 6: max class-D level (outdoors needs it); turn down here if it distorts

# The WM8960 is the clock master (its own 12.288 MHz oscillator), so both ESP
# buses run as secondaries on the same two clock pins.
i2s_audio:
  - id: i2s_out_bus
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
  - id: i2s_in_bus
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: hat_mic
    i2s_audio_id: i2s_in_bus
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    i2s_mode: secondary
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: left
    # Counts what actually arrives, for the Mic sample rate / Mic peak sensors
    on_data:
      - lambda: |-
          id(mic_bytes) += x.size();
          const int32_t *s = reinterpret_cast<const int32_t *>(x.data());
          for (size_t i = 0; i < x.size() / 4; i++) {
            const int32_t v = abs(s[i] >> 16);
            if (v > id(mic_peak)) id(mic_peak) = v;
          }

speaker:
  - platform: i2s_audio
    id: hat_speaker
    i2s_audio_id: i2s_out_bus
    i2s_dout_pin: GPIO44
    dac_type: external
    i2s_mode: secondary
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: wm8960_dac

  - platform: mixer
    id: mixing_speaker
    output_speaker: hat_speaker
    num_channels: 2
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 16000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 16000
    bits_per_sample: 16

# ---------------------------------------------------------------------------
# Media player (announcements + music), same layout as Voice PE
# ---------------------------------------------------------------------------

audio_file:
  - id: wake_sound_file
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
  - id: mute_on_sound_file
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_on.flac
  - id: mute_off_sound_file
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac
  - id: timer_sound_file
    file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac

media_source:
  - platform: audio_file
    id: audio_file_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000

media_player:
  - platform: speaker_source
    id: box_player
    name: Media Player
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 16000
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_source
        - http_announcement_source
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 16000
      speaker: media_resampling_speaker
      sources:
        - http_media_source
    volume_increment: 0.05
    volume_min: 0.0
    volume_max: 1.0
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing: box_player
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s

# ---------------------------------------------------------------------------
# Wake word + voice assistant
# ---------------------------------------------------------------------------

micro_wake_word:
  id: mww
  microphone:
    microphone: hat_mic
    channels: 0
    gain_factor: 2
  stop_after_detection: false
  models:
    # The robot's own wake words live on the Gimp. To make this box answer to
    # them too, add: - model: ${respeaker_repo_raw}/${respeaker_ref}/wake_words/hey_gimp.json
    - model: https://github.com/OHF-Voice/micro-wake-word/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
  vad:
    probability_cutoff: 0.05
  # Ignored while the box is talking or listening: at the front door its own
  # speaker (or a visitor) must never cut a sentence short or restart a question.
  on_wake_word_detected:
    - if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing: box_player
        then:
          - if:
              condition:
                switch.is_on: wake_sound
              then:
                - script.execute:
                    id: play_sound
                    sound_file: "wake_sound_file"
                - delay: 300ms
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: hat_mic
    channels: 0
    gain_factor: 2
  media_player: box_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 1.0
  on_client_connected:
    - if:
        condition:
          switch.is_off: mic_mute
        then:
          - micro_wake_word.start:
    - script.execute:
        id: set_leds
        phase: idle
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
    - script.execute:
        id: set_leds
        phase: offline
  on_start:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20
        duration: 0.0s
  on_listening:
    - script.execute:
        id: set_leds
        phase: listening
  on_stt_vad_end:
    - script.execute:
        id: set_leds
        phase: thinking
  # What the visitor said and what the box answered, for the transcript in HA
  on_stt_end:
    - homeassistant.event:
        event: esphome.greeter_transcript
        data:
          who: Visitor
          text: !lambda return x;
  on_tts_start:
    - script.execute:
        id: set_leds
        phase: replying
    - homeassistant.event:
        event: esphome.greeter_transcript
        data:
          who: Greeter
          text: !lambda return x;
  on_error:
    - if:
        condition:
          lambda: return code != "duplicate_wake_up_detected" && code != "stt-no-text-recognized";
        then:
          - script.execute:
              id: set_leds
              phase: error
          - delay: 1s
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - script.execute:
        id: set_leds
        phase: !lambda 'return id(mic_mute).state ? std::string("muted") : std::string("idle");'
  on_timer_finished:
    - repeat:
        count: 3
        then:
          - script.execute:
              id: play_sound
              sound_file: "timer_sound_file"
          - delay: 2s

# ---------------------------------------------------------------------------
# Controls: mute switch, wake sound switch, HAT button
# ---------------------------------------------------------------------------

switch:
  - platform: template
    id: mic_mute
    name: Mute microphone
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - script.execute:
          id: play_sound
          sound_file: "mute_on_sound_file"
      - script.execute:
          id: set_leds
          phase: muted
    on_turn_off:
      - if:
          condition:
            api.connected:
          then:
            - micro_wake_word.start:
      - script.execute:
          id: play_sound
          sound_file: "mute_off_sound_file"
      - script.execute:
          id: set_leds
          phase: idle
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: mdi:bullhorn
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # On: the HAT button starts the greeter routine in HA. Off: it just listens.
  - platform: template
    id: greeter_mode
    name: Greeter mode
    icon: mdi:account-voice
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  # Red light the MAX30102 saw at the end of the last finger scan (0-262143).
  # Much higher with a finger on the sensor; handy for telling a real finger
  # from a tap on the pad.
  - platform: template
    id: finger_level
    name: Finger scanner level
    icon: mdi:fingerprint
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  # Mic diagnostics, updated every 5 s. Sample rate should read 16000: anything
  # else means the HAT's clock isn't what the wm8960 component assumes, and wake
  # words won't work. Peak is the loudest sample (0-100 %): it should jump
  # when you talk, and sit near 0 in a quiet room.
  - platform: template
    id: mic_rate
    name: Mic sample rate
    icon: mdi:waveform
    unit_of_measurement: Hz
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: mic_level
    name: Mic peak
    icon: mdi:microphone
    unit_of_measurement: "%"
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: never

globals:
  - id: mic_bytes
    type: uint32_t
    initial_value: "0"
  - id: mic_peak
    type: int32_t
    initial_value: "0"

interval:
  # Keep the mic deaf while the box is talking and for 0.5 s after, so it never
  # hears its own voice as the visitor's answer (the HAT has no echo cancelling).
  - interval: 50ms
    then:
      - lambda: |-
          static uint32_t last_talk = 0;
          const uint32_t now = millis();
          const bool talking = id(box_player)->state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          if (talking) last_talk = now;
          const bool deaf = talking || (last_talk != 0 && now - last_talk < 500);
          if (deaf != id(hat_mic)->get_mute_state()) {
            id(hat_mic)->set_mute_state(deaf);
            ESP_LOGD("echo", "mic %s", deaf ? "deaf while talking" : "listening again");
          }
  - interval: 5s
    then:
      - lambda: |-
          const float rate = id(mic_bytes) / 4.0f / 5.0f;   // 32-bit mono samples per second
          const float peak = id(mic_peak) * 100.0f / 32768.0f;
          id(mic_bytes) = 0;
          id(mic_peak) = 0;
          ESP_LOGD("mic", "%.0f samples/s (want 16000), peak %.1f %%", rate, peak);
          id(mic_rate).publish_state(rate);
          id(mic_level).publish_state(peak);

binary_sensor:
  # Optional doorbell push button between D10 and GND. With Home Assistant
  # connected it starts the greeter (ha/front_door_greeter.yaml); without it,
  # it just flashes the ring.
  - platform: gpio
    id: doorbell_button
    name: Doorbell
    icon: mdi:doorbell
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 100ms
    on_press:
      - if:
          condition:
            and:
              - api.connected:
              - not:
                  voice_assistant.is_running:
          then:
            - script.execute:
                id: visitor
                source: doorbell
          else:
            - light.turn_on:
                id: ring_leds
                effect: Flash
            - delay: 2s
            - if:
                condition:
                  voice_assistant.is_running:
                then: []   # the voice pipeline is already driving the LEDs
                else:
                  - script.execute:
                      id: set_leds
                      phase: !lambda 'return id(mic_mute).state ? std::string("muted") : std::string("idle");'

  # CJMCU-0101 touch pad (the "fingerprint reader"). Its output goes high on
  # touch; if it reads backwards, add "inverted: true" under pin.
  - platform: gpio
    id: finger_pad
    name: Finger pad
    icon: mdi:fingerprint
    pin:
      number: GPIO38
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 200ms
    on_press:
      - if:
          condition:
            and:
              - api.connected:
              - not:
                  voice_assistant.is_running:
              - not:
                  script.is_running: finger_scan
          then:
            - script.execute: finger_scan

  - platform: gpio
    id: hat_button
    name: Button
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_multi_click:
      # Short press: start the greeter (or stop a running conversation).
      # Without Home Assistant's greeter automation it just starts listening.
      - timing:
          - ON for at most 0.8s
          - OFF for at least 0.3s
        then:
          - if:
              condition:
                voice_assistant.is_running:
              then:
                - voice_assistant.stop:
              else:
                - if:
                    condition:
                      switch.is_off: mic_mute
                    then:
                      - if:
                          condition:
                            switch.is_on: greeter_mode
                          then:
                            - script.execute:
                                id: visitor
                                source: button
                          else:
                            - voice_assistant.start:
      # Long press: mute / unmute the microphone
      - timing:
          - ON for at least 1.5s
        then:
          - switch.toggle: mic_mute

# ---------------------------------------------------------------------------
# LEDs: the three APA102s on the HAT and the 12-LED NeoPixel ring (camera ring)
#   HAT: off = ready, blue = listening, cyan = thinking, green = replying,
#        red = error, dim red = muted, amber breathing = starting / not connected
#   Ring: dark unless a conversation is running (same colours, animated);
#         Home Assistant drives it for the Dazzle and the night light
# ---------------------------------------------------------------------------

spi:
  - id: led_spi
    clk_pin: GPIO4
    mosi_pin: GPIO2

light:
  - platform: spi_led_strip
    id: hat_leds
    name: LEDs
    spi_id: led_spi
    num_leds: 3
    data_rate: 1MHz
    default_transition_length: 150ms
    effects:
      - pulse:
          name: Breathe
          transition_length: 1s
          update_interval: 1s
          min_brightness: 10%
          max_brightness: 60%
      - pulse:
          name: Fast pulse
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 20%
          max_brightness: 80%

  - platform: esp32_rmt_led_strip
    id: ring_leds
    name: Ring
    pin: GPIO3
    # RGBW ring (Adafruit 2851/2852/2853, SK6812 with a white chip in each LED).
    # For the RGB ring (Adafruit 1643) use chipset: WS2812 and channel_colors: GRB.
    # Wrong one = only 9 of the 12 LEDs light (RGBW takes 4 bytes per LED, RGB 3).
    chipset: SK6812
    channel_colors: GRBW
    num_leds: 12
    max_refresh_rate: 16ms
    default_transition_length: 150ms
    color_correct: [60%, 60%, 60%]   # caps current at ~430 mA on full white
    effects:
      - pulse:
          name: Breathe
          transition_length: 1s
          update_interval: 1s
          min_brightness: 10%
          max_brightness: 60%
      # A bright head with a fading tail chasing round the ring
      - addressable_lambda:
          name: Spin
          update_interval: 60ms
          lambda: |-
            static uint8_t pos = 0;
            const uint8_t n = it.size();
            it.all() = Color::BLACK;
            for (uint8_t t = 0; t < 4; t++) {
              it[(pos + n - t) % n] = current_color * (uint8_t) (255 >> (t * 2));
            }
            pos = (pos + 1) % n;
      # The whole ring rises and falls, like it's speaking
      - addressable_lambda:
          name: Talk
          update_interval: 40ms
          lambda: |-
            static float phase = 0;
            phase += 0.35f;
            const float level = 0.45f + 0.55f * fabsf(sinf(phase) * sinf(phase * 0.37f));
            it.all() = current_color * (uint8_t) (255 * level);
      # A scan line moving down and up the ring, over a dim glow
      - addressable_lambda:
          name: Finger Scan
          update_interval: 55ms
          lambda: |-
            static int step = 0;
            const int n = it.size(), half = n / 2;
            const int k = step <= half ? step : n - step;   // 0 .. half .. 1
            it.all() = current_color * (uint8_t) 30;
            it[k % n] = current_color;
            it[(n - k) % n] = current_color;
            step = (step + 1) % n;
      # Two bright comets chasing round, speeding up, over a dim glow
      - addressable_lambda:
          name: Face Scan
          update_interval: 16ms
          lambda: |-
            static float pos = 0, speed = 0.12f;
            if (initial_run) { pos = 0; speed = 0.12f; }
            const int n = it.size();
            it.all() = current_color * (uint8_t) 40;
            for (int c = 0; c < 2; c++) {
              const int head = ((int) pos + c * n / 2) % n;
              for (int t = 0; t < 3; t++) it[(head + n - t) % n] = current_color * (uint8_t) (255 >> (t * 2));
            }
            pos += speed;
            if (pos >= n) pos -= n;
            if (speed < 0.6f) speed += 0.0015f;
      # Fast spinning rainbow with white sparkles: pulls everyone's eyes to the lens
      - addressable_lambda:
          name: Dazzle
          update_interval: 20ms
          lambda: |-
            static uint8_t hue = 0;
            const int n = it.size();
            for (int i = 0; i < n; i++)
              it[i] = ESPHSVColor((uint8_t) (hue + i * 256 / n), 255, 255).to_rgb();
            if (random_uint32() % 3 == 0)
              it[random_uint32() % n] = Color(255, 255, 255, 255);
            hue += 9;
      - strobe:
          name: Flash
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 45%
              blue: 0%
              duration: 150ms
            - state: false
              duration: 150ms

script:
  # Tells Home Assistant someone is at the door. ha/front_door_greeter.yaml
  # takes it from there. source: finger, button or doorbell.
  - id: visitor
    parameters:
      source: string
    then:
      - homeassistant.event:
          event: esphome.greeter_visitor
          data:
            source: !lambda return source;

  # MAX30102 red LED: on = as bright as it goes (51 mA pulses, 800 per second,
  # red only), off = chip shut down. Registers from the MAX30102 datasheet.
  - id: pulse_ox_light
    parameters:
      light_on: bool
    then:
      - lambda: |-
          auto &d = *id(pulse_ox);
          if (light_on) {
            d.write_byte(0x09, 0x40);   // MODE: reset
            delay(2);
            d.write_byte(0x08, 0x10);   // FIFO: no averaging, roll over
            d.write_byte(0x0A, 0x73);   // SPO2 cfg: 16 uA range, 800 sps, 411 us pulses
            d.write_byte(0x0C, 0xFF);   // LED1 (red) 51 mA
            d.write_byte(0x0D, 0x00);   // LED2 (IR) off
            d.write_byte(0x09, 0x02);   // MODE: heart-rate (red LED only)
          } else {
            uint8_t id_ = 0;
            if (!d.read_byte(0xFF, &id_) || id_ != 0x15)
              ESP_LOGW("pulse_ox", "MAX30102 not answering at 0x57 (part id 0x%02X)", id_);
            d.write_byte(0x0C, 0x00);
            d.write_byte(0x09, 0x80);   // MODE: shut down
          }

  # The fake fingerprint scan: red light through the finger, scan line on the
  # ring, then hand over to Home Assistant.
  - id: finger_scan
    mode: single
    then:
      - script.execute:
          id: pulse_ox_light
          light_on: true
      - light.turn_on:
          id: ring_leds
          effect: Finger Scan
          red: 100%
          green: 0%
          blue: 0%
          brightness: 80%
      - light.turn_on:
          id: hat_leds
          effect: Fast pulse
          red: 100%
          green: 0%
          blue: 0%
      - delay: 2500ms
      - lambda: |-
          uint8_t b[3];
          if (id(pulse_ox).read_bytes(0x07, b, 3))
            id(finger_level).publish_state(((b[0] & 0x03) << 16) | (b[1] << 8) | b[2]);
      - script.execute:
          id: pulse_ox_light
          light_on: false
      - script.execute:
          id: set_leds
          phase: idle
      - script.execute:
          id: visitor
          source: finger

  # Plays one of the audio_file sounds above as an announcement
  - id: play_sound
    parameters:
      sound_file: string
    then:
      - lambda: |-
          id(box_player)->make_call()
            .set_media_url("audio-file://" + sound_file)
            .set_announcement(true)
            .perform();

  - id: set_leds
    mode: restart
    parameters:
      phase: string
    then:
      - lambda: |-
          // The camera ring is dark unless a conversation is running: Home Assistant
          // uses it for the Dazzle and as the night light. The HAT LEDs are off when
          // idle and only show listening / thinking / replying / muted / error / offline.
          const bool active = phase == "listening" || phase == "thinking" || phase == "replying";
          for (int ring = 0; ring < 2; ring++) {
            if ((ring && !active) || (!ring && phase == "idle")) {
              auto off = ring ? id(ring_leds).turn_off() : id(hat_leds).turn_off();
              off.perform();
              continue;
            }
            auto call = ring ? id(ring_leds).turn_on() : id(hat_leds).turn_on();
            call.set_effect("None");
            if (ring) call.set_white(0.0);   // RGBW ring: colour only, white chip off
            if (phase == "idle")           { call.set_rgb(0.0, 0.2, 1.0); call.set_brightness(0.08); }
            else if (phase == "listening") { call.set_rgb(0.0, 0.3, 1.0); call.set_brightness(0.7); }
            else if (phase == "thinking")  { call.set_rgb(0.0, 0.9, 1.0); call.set_brightness(0.6); call.set_effect(ring ? "Spin" : "Fast pulse"); }
            else if (phase == "replying")  { call.set_rgb(0.1, 1.0, 0.2); call.set_brightness(0.6); if (ring) call.set_effect("Talk"); }
            else if (phase == "error")     { call.set_rgb(1.0, 0.0, 0.0); call.set_brightness(0.8); }
            else if (phase == "muted")     { call.set_rgb(1.0, 0.0, 0.0); call.set_brightness(0.08); }
            else                           { call.set_rgb(1.0, 0.5, 0.0); call.set_brightness(0.4); call.set_effect("Breathe"); }
            call.perform();
          }
