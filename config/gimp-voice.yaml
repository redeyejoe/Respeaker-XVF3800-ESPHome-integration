# =============================================================================
# The Gimp: reSpeaker Flex XVF3800 (circular) + XIAO ESP32-S3 voice satellite
#
# Paste this into a new device in ESPHome Builder. Your Wi-Fi, API and OTA
# secrets come from ESPHome Builder's own secrets.yaml.
#
# Before the first install, the Flex must already have the circular-array I2S
# firmware (respeaker_flex_i2s_c48k2ch_v1.0.4.bin) flashed with dfu-util.
# This config never touches the XMOS firmware.
#
# CONFIG VERSION 1.3
#   1.3  2026-10-23  voice light calibrated: the mics read face = 90, left ear = 180
#                    (counter-clockwise), so ring_reverse true + ring_led_offset 6
#                    with head_rotation 180
#   1.2  2026-10-23  ring_led_offset back to 0 until measured: the "wrong side" was
#                    mostly a bug that dropped every voice direction from 180 to 345
#                    degrees (fixed in the component, commit da2b07c)
#   1.1  2026-10-23  cap turned round on the head: head_rotation 180, and the voice
#                    light moved half way round the 24 ring (ring_led_offset 12) -
#                    it lit the side opposite the voice
#   1.0  2026-10-19  first version
# =============================================================================

substitutions:
  name: gimp-voice
  friendly_name: Gimp Voice
  respeaker_ref: main
  # Head LEDs: one chain, jewel 7 -> ring 12 -> ring 16 -> ring 24 (59 LEDs),
  # data in on D0. See packages/flex-rings.yaml for the calibration.
  head_leds_pin: GPIO1
  # "180" if the cap sits on the head turned round from the LED calibration
  head_rotation: "180"
  # Line the mic directions up with the 24 ring (see packages/base.yaml):
  # say the wake word from straight in front and adjust until the beam faces you.
  # 15 degrees per LED: 12 = half way round, 6 = a quarter turn.
  # Measured 2026-10-23: "Voice Direction" read face = 90, left ear = 180.
  # These two go with head_rotation "180" (with "0" the offset would be 18).
  ring_led_offset: "6"
  ring_reverse: "true"

packages:
  respeaker:
    url: https://github.com/redeyejoe/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/flex-rings.yaml
      - packages/timers-alarm.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
