# =============================================================================
# The Gimp: reSpeaker Flex XVF3800 (circular) + XIAO ESP32-S3 voice satellite
#
# Paste this into a new device in ESPHome Builder. Your Wi-Fi, API and OTA
# secrets come from ESPHome Builder's own secrets.yaml.
#
# Before the first install, the Flex must already have the circular-array I2S
# firmware (respeaker_flex_i2s_c48k2ch_v1.0.4.bin) flashed with dfu-util.
# This config never touches the XMOS firmware.
# =============================================================================

substitutions:
  name: gimp-voice
  friendly_name: Gimp Voice
  respeaker_ref: main
  # Head LEDs: one chain, jewel 7 -> ring 12 -> ring 16 -> ring 24 (59 LEDs),
  # data in on D0. See packages/flex-rings.yaml for the calibration.
  head_leds_pin: GPIO1
  # "180" if the cap sits on the head turned round from the LED calibration
  head_rotation: "0"
  # Line the mic directions up with the 24 ring (see packages/base.yaml):
  # say the wake word from straight in front and adjust until the beam faces you.
  ring_led_offset: "0"
  ring_reverse: "false"

packages:
  respeaker:
    url: https://github.com/redeyejoe/Respeaker-XVF3800-ESPHome-integration
    ref: ${respeaker_ref}
    refresh: 1d
    files:
      - packages/base.yaml
      - packages/hardware.yaml
      - packages/voice-assistant.yaml
      - packages/leds.yaml
      - packages/flex-rings.yaml
      - packages/timers-alarm.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password
