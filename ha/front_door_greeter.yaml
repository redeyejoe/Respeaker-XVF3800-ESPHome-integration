# =============================================================================
# Front door greeter: Home Assistant side          PACKAGE VERSION 1.7
# (shows in HA as sensor.front_door_greeter_version - bump both together)
#
# Changes
#   1.7  2026-10-23  own email/text notifier: notify.front_door_notify
#   1.6  2026-10-23  messages also go out through Doug's existing notify.gdoor_notify
#                    (email to Hotmail + text via the Verizon email gateway)
#   1.5  2026-10-23  "Would you like to leave a message?" after a minute with no
#                    answer or a second press; message text to phone (+ email)
#   1.4  2026-10-23  mode: restart; a failed line no longer stops the routine;
#                    "Thank you..." / "I have notified the homeowners..." lines
#   1.3  2026-10-23  Doug's entities: camera.doorbell_2, notify.sm_s546vl,
#                    media_player.home_audio_5, tts.piper
#   1.2  2026-10-23  ring dark when idle; Front door night light automation
#   1.1  2026-10-23  scripted flow (ask_question): help + name questions, house
#                    announcement, Dazzle, "Facial scan complete..."
#   1.0  2026-10-21  first version: scan theatre + AI conversation
#
# Works with config/respeaker-2mic-xiao.yaml. Someone presses the doorbell (or
# the box's button, or touches the finger pad) and:
#   1. finger pad only: "Fingerprint scan complete."
#   2. "Hello, how can I help you?"            -> listens, keeps the answer
#   3. "And who should I tell them is here?"   -> listens, keeps the name
#   4. "I will see if anyone is here and available to answer the door. Please wait."
#   5. Whole home audio (Google speaker group): "Someone is at the front door.
#      It's <name>. They said: <reason>."  The name comes from, in order:
#      face recognition (when wired up), a known phone that just joined the
#      Wi-Fi, or what they said.
#   6. Rainbow "Dazzle" on the camera ring for a few seconds while HA takes a
#      snapshot (everyone looks at the lights = looks at the lens).
#   7. "Facial scan complete. Wi-Fi identified, and logged with your profile."
#      "I have notified the homeowners. If they are available, they will be with you shortly."
#   8. Your phone gets the summary (the snapshot is saved to
#      /config/www/front_door_visitor.jpg), and it goes in the logbook.
#   9. If nobody answers within a minute, or they press the button again:
#      "It looks like no one is available right now. Would you like to leave a
#      message?" -> records what they say as text -> phone app + email + text.
#
# Needs Home Assistant 2025.7 or newer (assist_satellite.ask_question).
#
# Install: put this file in /config/packages/ and make sure configuration.yaml has
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant.
#
# Before it works:
#   - Settings > Devices > ESPHome > Voice Box > Configure: turn on
#     "Allow the device to perform Home Assistant actions".
#   - Check the entity ids in the automation's variables block (Settings >
#     Entities), and the satellite id in script.greeter_say.
#   - The Voice Box firmware needs the "Dazzle" ring effect (current
#     config/respeaker-2mic-xiao.yaml has it).
# =============================================================================

template:
  - sensor:
      - name: Front door greeter version
        unique_id: front_door_greeter_version
        icon: mdi:tag-outline
        state: "1.7"

  # Everything said during a visit, one line per turn ("log" attribute; a state
  # is limited to 255 characters). The box sends what the visitor says.
  - triggers:
      - trigger: event
        event_type: esphome.greeter_transcript
      - trigger: event
        event_type: greeter_transcript_reset
    sensor:
      - name: Front door transcript
        unique_id: front_door_greeter_transcript
        icon: mdi:script-text-outline
        state: >-
          {{ (trigger.event.data.get('text', '') | string)[:250] }}
        attributes:
          log: >-
            {%- if trigger.event.event_type == 'greeter_transcript_reset' -%}
            {%- else -%}
              {{ this.attributes.get('log', '') ~ trigger.event.data.get('who', '?') ~ ': ' ~ trigger.event.data.get('text', '') ~ '\n' }}
            {%- endif -%}

# Phones of people who visit (from your router / UniFi / nmap integration).
# A phone in this group that joined the Wi-Fi in the last 10 minutes counts as
# "Wi-Fi identified". Add your device_tracker entities, then reload groups.
# group:
#   greeter_known_phones:
#     name: Greeter known phones
#     entities:
#       - device_tracker.johns_phone
#       - device_tracker.moms_iphone

# A visit is "waiting" for a minute after the greeter finishes. A second press in
# that minute (or the minute running out) offers to take a message. Turn
# "Front door answered" on (dashboard button, or an automation on your door
# sensor) to tell it someone came to the door, and it won't offer.
input_boolean:
  front_door_waiting:
    name: Front door waiting for an answer
    icon: mdi:door-closed-lock
  front_door_answered:
    name: Front door answered
    icon: mdi:door-open

input_text:
  front_door_visitor:
    name: Front door visitor
    max: 255

# Email + text: the front_door_notify SMTP notifier in configuration.yaml
# (Gmail app password in secrets.yaml -> redeye_joe@hotmail.com + the phone's vtext address).

script:
  # Nobody came: offer to take a message, turn it into text, send it to Doug
  greeter_take_message:
    alias: Greeter take a message
    mode: single
    max_exceeded: silent
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.front_door_waiting
      - variables:
          satellite: assist_satellite.voice_box_assist_satellite
          visitor: >-
            {%- set v = states('input_text.front_door_visitor') -%}
            {{ 'someone' if v in ['unknown', 'unavailable', ''] else v }}
          when: "{{ now().strftime('%-I:%M %p') }}"
      - event: esphome.greeter_transcript
        event_data:
          who: Greeter
          text: It looks like no one is available right now. Would you like to leave a message?
      - action: assist_satellite.ask_question
        continue_on_error: true
        data:
          entity_id: "{{ satellite }}"
          question: It looks like no one is available right now. Would you like to leave a message?
          preannounce: false
          answers:
            - id: "yes"
              sentences:
                - "yes [please]"
                - "(yeah|yep|sure|okay|ok)"
                - "[yes] I would [like to]"
            - id: "no"
              sentences:
                - "no [thanks|thank you]"
                - "(nope|not now|that's okay|that's ok|I'm good|no I'm good)"
        response_variable: offer
      - delay: 1
      - if: "{{ offer is defined and offer and offer.id == 'yes' }}"
        then:
          - event: esphome.greeter_transcript
            event_data:
              who: Greeter
              text: Okay, please leave your message now. I'm listening.
          - action: assist_satellite.ask_question
            continue_on_error: true
            data:
              entity_id: "{{ satellite }}"
              question: Okay, please leave your message now. I'm listening.
              preannounce: false
            response_variable: msg
          - variables:
              message_text: "{{ (msg.sentence if msg is defined and msg else '') | trim }}"
          - delay: 1
          - action: script.greeter_say
            continue_on_error: true
            data:
              message: Thank you. Your message has been delivered. Have a nice day.
          - action: notify.send_message
            continue_on_error: true
            target:
              entity_id: notify.sm_s546vl                # Doug's phone (Companion app)
            data:
              title: "Message from {{ visitor }} at the front door ({{ when }})"
              message: "{{ message_text or '(they said yes, but nothing was heard)' }}"
          - action: notify.front_door_notify          # email + text (SMTP notifier)
            continue_on_error: true
            data:
              title: "Front door message from {{ visitor }} ({{ when }})"
              message: "{{ visitor }} left a message at the front door at {{ when }}:\n\n{{ message_text or '(nothing was heard)' }}"
          - action: logbook.log
            data:
              name: Front door
              entity_id: "{{ satellite }}"
              message: "Message from {{ visitor }}: {{ message_text or '(nothing heard)' }}"
        else:
          - action: script.greeter_say
            continue_on_error: true
            data:
              message: Okay. Have a nice day.

  # One line said by the greeter box, also written to the transcript
  greeter_say:
    alias: Greeter say
    mode: queued
    fields:
      message:
        selector:
          text:
    sequence:
      - action: assist_satellite.announce
        target:
          entity_id: assist_satellite.voice_box_assist_satellite
        data:
          message: "{{ message }}"
          preannounce: false
      - event: esphome.greeter_transcript
        event_data:
          who: Greeter
          text: "{{ message }}"

automation:
  - id: front_door_greeter
    alias: Front door greeter
    description: Greets the visitor, asks who they are, announces them on the whole home audio
    mode: restart          # a new press starts over (a stuck run can never block it)
    triggers:
      - trigger: event
        event_type: esphome.greeter_visitor
    variables:
      satellite: assist_satellite.voice_box_assist_satellite
      ring: light.voice_box_ring
      camera: camera.doorbell_2                      # the Pi doorbell camera (Frigate)
      house_speakers: media_player.home_audio_5      # your Google speaker group
      house_tts: tts.piper                           # the TTS engine for the house announcement
      face_sensor: sensor.greeter_face_name          # optional: name from face recognition
      snapshot: /config/www/front_door_visitor.jpg
      source: "{{ trigger.event.data.source | default('button') }}"
      how: >-
        {{ {'finger': 'touched the finger pad', 'doorbell': 'rang the doorbell',
            'button': 'pressed the button'}.get(source, source) }}
      started: "{{ now().strftime('%-I:%M %p') }}"
    actions:
      # second press while a visit is still waiting for an answer: offer to take a message
      - if:
          - condition: state
            entity_id: input_boolean.front_door_waiting
            state: "on"
          - condition: template
            value_template: "{{ (now() - states.input_boolean.front_door_waiting.last_changed).total_seconds() < 180 }}"
        then:
          - action: script.greeter_take_message
          - stop: Second press - took a message

      - event: greeter_transcript_reset

      - if: "{{ source == 'finger' }}"
        then:
          - action: script.greeter_say
            data:
              message: Fingerprint scan complete.

      # --- what do they want, and who are they ---
      - event: esphome.greeter_transcript
        event_data:
          who: Greeter
          text: Hello, how can I help you?
      - action: assist_satellite.ask_question
        continue_on_error: true
        data:
          entity_id: "{{ satellite }}"
          question: Hello, how can I help you?
          preannounce: false
        response_variable: help_answer
      - event: esphome.greeter_transcript
        event_data:
          who: Greeter
          text: And who should I tell them is here?
      - action: assist_satellite.ask_question
        continue_on_error: true
        data:
          entity_id: "{{ satellite }}"
          question: And who should I tell them is here?
          preannounce: false
          answers:
            - id: name
              sentences:
                - "[it's|it is|this is|i'm|i am|my name is|tell them] {name}"
        response_variable: name_answer
      - delay: 1   # let the satellite finish listening before it talks again
      - action: script.greeter_say
        continue_on_error: true
        data:
          message: Thank you. I will see if anyone is here and available to answer the door. Please wait.

      # --- work out who it is ---
      - variables:
          said_help: "{{ (help_answer.sentence if help_answer is defined and help_answer else '') | trim }}"
          said_name: >-
            {%- if name_answer is defined and name_answer -%}
              {{ (name_answer.slots.name if name_answer.id == 'name' and name_answer.slots.name is defined else name_answer.sentence) | trim }}
            {%- endif -%}
          face_name: >-
            {%- set f = states(face_sensor) -%}
            {{ '' if f in ['unknown', 'unavailable', 'none', 'None', ''] else f }}
          wifi_names: >-
            {%- set ns = namespace(n=[]) -%}
            {%- for e in expand('group.greeter_known_phones') if e.state == 'home' and (now() - e.last_changed).total_seconds() < 600 -%}
              {%- set ns.n = ns.n + [e.name | regex_replace("(?i)['’]?s? ?(phone|iphone|pixel|galaxy)$", '')] -%}
            {%- endfor -%}
            {{ ns.n | join(' and ') }}
          who: "{{ face_name or wifi_names or said_name }}"
          house_message: >-
            Someone is at the front door.
            {%- if who %} It's {{ who }}.{% endif %}
            {%- if said_help %} They said: {{ said_help }}.{% endif %}

      # --- tell the house ---
      - action: tts.speak
        continue_on_error: true
        target:
          entity_id: "{{ house_tts }}"
        data:
          media_player_entity_id: "{{ house_speakers }}"
          message: "{{ house_message }}"

      # --- dazzle them into looking at the camera, grab the picture ---
      - action: light.turn_on
        target:
          entity_id: "{{ ring }}"
        data:
          effect: Dazzle
          brightness_pct: 100
      - delay: 2
      - action: camera.snapshot
        continue_on_error: true
        target:
          entity_id: "{{ camera }}"
        data:
          filename: "{{ snapshot }}"
      - delay: 2
      # ring back to dark, or to the night light if it's dark out and they're still there
      - if:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
          - condition: state
            entity_id: binary_sensor.doorbell_person_occupancy
            state: "on"
        then:
          - action: light.turn_on
            target:
              entity_id: "{{ ring }}"
            data:
              effect: None
              rgbw_color: [0, 0, 0, 255]
              brightness_pct: 100
        else:
          - action: light.turn_off
            target:
              entity_id: "{{ ring }}"
      - action: script.greeter_say
        continue_on_error: true
        data:
          message: Facial scan complete. Wi-Fi identified, and logged with your profile.
      - delay: 1
      - action: script.greeter_say
        continue_on_error: true
        data:
          message: I have notified the homeowners. If they are available, they will be with you shortly.

      # --- tell me ---
      - delay: 3   # lets the last transcript line arrive
      - variables:
          transcript: "{{ state_attr('sensor.front_door_transcript', 'log') or '(nothing said)' }}"
      - action: logbook.log
        data:
          name: Front door
          entity_id: "{{ satellite }}"
          message: "{{ started }}: {{ who or 'unknown visitor' }} {{ how }}. {{ transcript | replace('\n', ' | ') }}"
      - action: notify.send_message
        continue_on_error: true
        target:
          entity_id: notify.sm_s546vl                # Doug's phone (Companion app)
        data:
          title: "Front door: {{ who or 'someone' }} ({{ started }})"
          message: "{{ house_message }}\n\n{{ transcript }}"

      # --- nobody answers within a minute (or they press again): offer to take a message ---
      - action: input_text.set_value
        target:
          entity_id: input_text.front_door_visitor
        data:
          value: "{{ (who or 'someone')[:250] }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.front_door_answered
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.front_door_waiting
      - wait_for_trigger:
          - trigger: state
            entity_id: input_boolean.front_door_answered
            to: "on"
        timeout: "00:01:00"
      - if: "{{ wait.trigger is none }}"
        then:
          - action: script.greeter_take_message
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.front_door_waiting

      # For a real text message instead, set up the Twilio SMS integration and use:
      # - action: notify.twilio_sms
      #   data:
      #     target: "+1XXXXXXXXXX"
      #     message: "Front door {{ started }}: {{ house_message }}"

  # Camera ring as a porch light: full white (the RGBW ring's white chips, steady,
  # so no flicker on the camera) when Frigate sees a person after dark. Off again a
  # minute after they leave. Leaves the ring alone while the greeter is running.
  - id: front_door_night_light
    alias: Front door night light
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.doorbell_person_occupancy   # Frigate: doorbell camera, person
        to: "on"
    conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: automation.front_door_greeter
        attribute: current
        state: 0
    actions:
      - action: light.turn_on
        target:
          entity_id: light.voice_box_ring
        data:
          effect: None
          rgbw_color: [0, 0, 0, 255]
          brightness_pct: 100
      - wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.doorbell_person_occupancy
            to: "off"
            for: "00:01:00"
        timeout: "00:15:00"
      - condition: state
        entity_id: automation.front_door_greeter
        attribute: current
        state: 0
      - action: light.turn_off
        target:
          entity_id: light.voice_box_ring
